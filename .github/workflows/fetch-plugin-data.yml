name: Refresh plugin JSON

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin JSON
        env:
          JSON_URL: ${{ secrets.JSON_URL }}
        run: |
          set -euo pipefail
          test -n "$JSON_URL" || { echo "JSON_URL secret is not configured" >&2; exit 1; }
          mkdir -p public/data
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$JSON_URL" \
            --output public/data/arsenal.json.tmp

      - name: Validate JSON
        run: |
          python3 -m json.tool public/data/arsenal.json.tmp > /dev/null
          mv public/data/arsenal.json.tmp public/data/arsenal.json

      - name: Commit refreshed JSON
        run: |
          set -euo pipefail

          # Keep the freshly downloaded JSON outside the worktree.
          cp public/data/arsenal.json /tmp/arsenal.json

          # Move the worktree to the latest main.
          git fetch origin main
          git reset --hard origin/main

          # Restore the freshly downloaded JSON on top of latest main.
          mkdir -p public/data
          cp /tmp/arsenal.json public/data/arsenal.json

          git add public/data/arsenal.json

          if git diff --cached --quiet; then
            echo "Plugin JSON is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh plugin JSON"
            git push origin HEAD:main
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-json

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
