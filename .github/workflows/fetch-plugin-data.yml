name: Refresh plugin JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin JSON
        env:
          JSON_URL: ${{ secrets.JSON_URL }}
        run: |
          set -euo pipefail
          test -n "$JSON_URL" || { echo "JSON_URL secret is not configured" >&2; exit 1; }
          mkdir -p public/data
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$JSON_URL" \
            --output public/data/arsenal.json.tmp

      - name: Validate JSON
        run: |
          python3 -m json.tool public/data/arsenal.json.tmp > /dev/null
          mv public/data/arsenal.json.tmp public/data/arsenal.json

      - name: Commit refreshed JSON
        run: |
          git add public/data/arsenal.json

          if git diff --cached --quiet; then
            echo "Plugin JSON is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh plugin JSON"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
